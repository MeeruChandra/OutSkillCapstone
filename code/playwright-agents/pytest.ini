[pytest]
# Pytest configuration for Playwright tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --capture=no

# Markers
markers =
    smoke: Quick smoke tests
    regression: Full regression tests
    registration: User registration tests
